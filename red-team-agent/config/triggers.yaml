# Trigger definitions. Each `when` clause is a boolean condition; the first
# trigger whose conditions are all satisfied fires. The trigger id flows
# through to personas.py:TRIGGER_TO_PERSONAS to pick the speakers.
#
# Supported conditions (extend in app/triggers.py:evaluate_triggers as you go):
#   stage_in: ["Stage 4 - Demo", "Stage 5 - Proposal"]
#   days_in_stage_gte: 14
#   transcript_contains_any: ["openai", "gpt", "homegrown"]
#   field_changed: "Amount"
#   last_activity_days_gte: 10
#   always_on: true      # for smoke tests only — fires unconditionally
triggers:
  - id: smoke_test
    when:
      always_on: true
