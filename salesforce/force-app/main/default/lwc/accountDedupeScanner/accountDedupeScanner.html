<template>
    <div class="slds-grid slds-gutters slds-wrap">

        <!-- Left column: run scan + scan history -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
            <lightning-card title="Run a new scan" icon-name="standard:merge">
                <div class="slds-p-horizontal_medium">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                        Pick the scenarios to run across all Accounts.
                    </p>
                    <template for:each={scenarioOptions} for:item="opt">
                        <div key={opt.key} class="slds-m-bottom_xx-small">
                            <label class="slds-checkbox_toggle slds-grid">
                                <input type="checkbox" data-key={opt.key}
                                    checked={opt.checked} onchange={handleScenarioToggle} />
                                <span class="slds-m-left_x-small">{opt.label}</span>
                            </label>
                        </div>
                    </template>
                    <div class="slds-m-top_small">
                        <lightning-button label="Run scan" variant="brand"
                            onclick={handleRunScan} disabled={runDisabled}></lightning-button>
                        <template lwc:if={starting}>
                            <lightning-spinner alternative-text="Starting" size="small"></lightning-spinner>
                        </template>
                    </div>
                </div>
            </lightning-card>

            <lightning-card title="Recent scans" icon-name="standard:report" class="slds-m-top_small">
                <template lwc:if={hasScans}>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={scanRows} for:item="s">
                            <li key={s.id} class={s.rowClass}
                                data-id={s.id} onclick={handleScanClick}>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <div class="slds-grow">
                                        <div class="slds-text-title slds-text-color_default">{s.name}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            <lightning-formatted-date-time value={s.startedAt}
                                                year="numeric" month="short" day="2-digit"
                                                hour="2-digit" minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </div>
                                    </div>
                                    <lightning-badge label={s.status} variant={s.statusVariant}></lightning-badge>
                                </div>
                                <div class="slds-text-body_small slds-m-top_xx-small">
                                    {s.groupCount} groups · {s.accountCount} accounts
                                </div>
                                <template lwc:if={s.errorMessage}>
                                    <div class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">
                                        {s.errorMessage}
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak slds-p-horizontal_medium slds-p-vertical_small">
                        No scans yet. Run one above.
                    </p>
                </template>
            </lightning-card>
        </div>

        <!-- Right column: groups for active scan -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
            <lightning-card title="Duplicate groups" icon-name="standard:related_list">
                <lightning-button slot="actions" label={manualPanelToggleLabel}
                    variant="neutral" icon-name="utility:add"
                    onclick={handleToggleManualPanel}></lightning-button>
                <lightning-button-icon slot="actions" icon-name="utility:refresh"
                    alternative-text="Refresh" title="Refresh" onclick={refreshGroups}
                    disabled={loadingGroups} class="slds-m-left_xx-small"></lightning-button-icon>

                <div class="slds-p-horizontal_medium">
                    <template lwc:if={error}>
                        <div class="slds-text-color_error slds-p-vertical_small">{error}</div>
                    </template>

                    <!-- Manual group panel -->
                    <template lwc:if={manualPanelOpen}>
                        <div class="manual-panel slds-box slds-box_x-small slds-m-bottom_small">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <h3 class="slds-text-heading_small slds-grow">Add a manual duplicate group</h3>
                                <span class="slds-text-body_small slds-text-color_weak">{manualCountLabel}</span>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                Use for hierarchy duplicates the rules can't catch (e.g. parent + intl subsidiary).
                                Pick 2–5 accounts.
                            </p>
                            <div class="slds-grid slds-gutters_x-small slds-m-bottom_x-small">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input type="text" label="Match key (optional)"
                                        placeholder="e.g. pantheon"
                                        value={manualMatchKey}
                                        onchange={handleManualMatchKeyChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-record-picker label="Find account"
                                        placeholder="Search Accounts…"
                                        object-api-name="Account"
                                        disabled={manualPickerDisabled}
                                        onchange={handleAccountPicked}>
                                    </lightning-record-picker>
                                </div>
                            </div>
                            <template lwc:if={manualSelectedRows.length}>
                                <ul class="manual-selected slds-m-bottom_x-small">
                                    <template for:each={manualSelectedRows} for:item="a">
                                        <li key={a.accountId} class="manual-chip">
                                            <span class="manual-chip__name">{a.displayName}</span>
                                            <template lwc:if={a.website}>
                                                <span class="manual-chip__site">{a.website}</span>
                                            </template>
                                            <button type="button" class="manual-chip__remove"
                                                data-id={a.accountId}
                                                onclick={handleRemoveManualAccount}
                                                aria-label="Remove">&times;</button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-button label="Create group" variant="brand"
                                    disabled={manualCreateDisabled}
                                    onclick={handleCreateManualGroup}></lightning-button>
                                <lightning-button label="Cancel" variant="neutral"
                                    class="slds-m-left_x-small"
                                    onclick={handleCancelManualPanel}></lightning-button>
                                <template lwc:if={manualSubmitting}>
                                    <lightning-spinner alternative-text="Saving" size="small"
                                        class="slds-m-left_x-small"></lightning-spinner>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Filters row -->
                    <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-end slds-m-bottom_x-small filters-row">
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-combobox label="Status" value={statusFilter}
                                options={statusFilterOptions}
                                onchange={handleStatusFilterChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-combobox label="Scenario" value={scenarioFilter}
                                options={scenarioFilterOptions}
                                onchange={handleScenarioFilterChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-combobox label="Sort by" value={sortBy}
                                options={sortOptions} onchange={handleSortChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input type="search" label="Search"
                                placeholder="Match domain, GRP-#, or scenario"
                                value={searchQuery} onchange={handleSearchChange}>
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Summary bar + bulk actions -->
                    <div class="summary-bar slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                        <template lwc:if={hasFilteredGroups}>
                            <label class="slds-m-right_small slds-grid slds-grid_vertical-align-center select-all">
                                <input type="checkbox" checked={selectAllChecked}
                                    onchange={handleSelectAll}
                                    aria-label="Select all groups" />
                            </label>
                        </template>
                        <div class="slds-grow summary-text">{summaryLabel}</div>
                        <template lwc:if={hasSelection}>
                            <div class="slds-m-right_x-small slds-text-body_small">
                                {selectedCount} selected
                            </div>
                            <lightning-button label={bulkDismissLabel} variant="destructive-text"
                                icon-name="utility:close" onclick={handleBulkDismiss}
                                disabled={dismissingBulk}></lightning-button>
                            <template lwc:if={dismissingBulk}>
                                <lightning-spinner alternative-text="Dismissing" size="small"
                                    class="slds-m-left_x-small"></lightning-spinner>
                            </template>
                        </template>
                    </div>

                    <template lwc:if={loadingGroups}>
                        <div class="slds-align_absolute-center slds-p-vertical_small">
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <template lwc:if={hasFilteredGroups}>
                        <ul class="dedupe-groups">
                            <template for:each={groupRows} for:item="g">
                                <li key={g.id} class={g.rowClass}>
                                    <div class="dedupe-group__header">
                                        <label class="dedupe-group__check">
                                            <input type="checkbox" data-id={g.id}
                                                checked={g.selected} onchange={handleGroupSelect}
                                                aria-label="Select group" />
                                        </label>
                                        <div class="dedupe-group__main"
                                            data-id={g.id} onclick={handleGroupClick}>
                                            <lightning-icon icon-name={g.chevron} size="x-small"
                                                class="slds-m-right_x-small"></lightning-icon>
                                            <div class="dedupe-group__title">
                                                <div class="dedupe-group__key">{g.displayMatchKey}</div>
                                                <div class="dedupe-group__meta">
                                                    <span class={g.scenarioChipClass}>{g.scenarioLabel}</span>
                                                    <template lwc:if={g.showMergePill}>
                                                        <span class="merge-pill" title="Salesforce merge handles up to 3 accounts per call">{g.mergeLabel}</span>
                                                    </template>
                                                    <span class={g.riskClass} title={g.riskTitle}>{g.riskLabel}</span>
                                                    <span class="dedupe-group__meta-text">{g.metaLine}</span>
                                                </div>
                                            </div>
                                            <lightning-badge label={g.status} variant={g.statusVariant}></lightning-badge>
                                        </div>
                                        <lightning-button-icon data-id={g.id} icon-name="utility:close"
                                            alternative-text="Not a duplicate" title="Not a duplicate"
                                            variant="border-filled" size="small"
                                            onclick={handleDismissGroup}
                                            class="slds-m-left_x-small"></lightning-button-icon>
                                    </div>

                                    <template lwc:if={g.expanded}>
                                        <div class="dedupe-group__body">
                                            <template lwc:if={g.errorMessage}>
                                                <div class="slds-box slds-box_x-small slds-theme_error slds-m-bottom_x-small">
                                                    <lightning-icon icon-name="utility:error" size="x-small"
                                                        class="slds-m-right_xx-small"></lightning-icon>
                                                    {g.errorMessage}
                                                </div>
                                            </template>
                                            <template lwc:if={expandedMergeMode}>
                                                <c-account-compare-merge
                                                    account-ids={mergeAccountIds}
                                                    initial-master-id={expandedMasterId}
                                                    onmergecomplete={handleMergeComplete}
                                                    oncancel={handleMergeCancel}>
                                                </c-account-compare-merge>
                                            </template>
                                            <template lwc:else>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                                Pick a master, then resolve any duplicate contact relations before merging.
                                            </p>
                                            <table class="slds-table slds-table_bordered slds-table_cell-buffer dedupe-members">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th style="width: 4rem;">Master</th>
                                                        <th>Account</th>
                                                        <th>Website</th>
                                                        <th>LinkedIn</th>
                                                        <th>Owner</th>
                                                        <th style="width: 3rem;"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={g.members} for:item="m">
                                                        <tr key={m.accountId} class={m.rowClass}>
                                                            <td>
                                                                <input type="radio" name={m.radioName}
                                                                    id={m.radioId} data-id={m.accountId}
                                                                    checked={m.isMaster}
                                                                    onchange={handleMasterPick} />
                                                            </td>
                                                            <td class="col-account">{m.accountName}</td>
                                                            <td class="col-url" title={m.website}>{m.website}</td>
                                                            <td class="col-url" title={m.linkedIn}>{m.linkedIn}</td>
                                                            <td>{m.ownerName}</td>
                                                            <td>
                                                                <lightning-button-icon data-id={m.accountId}
                                                                    icon-name="utility:new_window"
                                                                    alternative-text="Open" title="Open record"
                                                                    onclick={handleOpenAccount}></lightning-button-icon>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>

                                            <div class="br-section slds-m-top_small">
                                                <div class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">Business records</div>
                                                <table class="slds-table slds-table_bordered slds-table_cell-buffer br-table">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th>Account</th>
                                                            <th>Open opps</th>
                                                            <th>Renewal opps</th>
                                                            <th>Active contracts</th>
                                                            <th>Activities (90d)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={g.businessRecordRows} for:item="b">
                                                            <tr key={b.accountId} class={b.rowClass}>
                                                                <td>{b.accountName}</td>
                                                                <td class={b.openOppsClass}>{b.openOpps}</td>
                                                                <td class={b.renewalOppsClass}>{b.renewalOpps}</td>
                                                                <td class={b.activeContractsClass}>{b.activeContracts}</td>
                                                                <td>{b.recentActivities}</td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    Red cells = both master and a duplicate hold the same record type — merging would create a collision.
                                                </p>
                                            </div>

                                            <div class="acr-section slds-m-top_small">
                                                <template lwc:if={expandedAcrLoading}>
                                                    <div class="slds-align_absolute-center slds-p-vertical_x-small">
                                                        <lightning-spinner alternative-text="Checking relations" size="small"></lightning-spinner>
                                                    </div>
                                                </template>

                                                <template lwc:if={hasAcrConflicts}>
                                                    <div class="slds-box slds-box_x-small slds-theme_warning slds-m-bottom_x-small acr-banner">
                                                        <lightning-icon icon-name="utility:warning" size="x-small"
                                                            class="slds-m-right_xx-small"></lightning-icon>
                                                        {acrConflictsLabel}
                                                    </div>
                                                    <table class="slds-table slds-table_bordered slds-table_cell-buffer acr-table">
                                                        <thead>
                                                            <tr class="slds-line-height_reset">
                                                                <th>Contact</th>
                                                                <th>Title</th>
                                                                <th>Email</th>
                                                                <th>On accounts</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template for:each={acrConflictRows} for:item="c">
                                                                <tr key={c.key}>
                                                                    <td>{c.contactName}</td>
                                                                    <td>{c.contactTitle}</td>
                                                                    <td>{c.contactEmail}</td>
                                                                    <td>
                                                                        <template for:each={c.relations} for:item="r">
                                                                            <div key={r.key} class={r.cellClass}>
                                                                                {r.label}
                                                                            </div>
                                                                        </template>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                    <div class="slds-m-top_x-small slds-grid slds-grid_vertical-align-center">
                                                        <lightning-button label={cleanupButtonLabel}
                                                            variant="brand" disabled={cleanupDisabled}
                                                            onclick={handleCleanupAcrs}></lightning-button>
                                                        <template lwc:if={expandedAcrCleaning}>
                                                            <lightning-spinner alternative-text="Cleaning"
                                                                size="small"
                                                                class="slds-m-left_x-small"></lightning-spinner>
                                                        </template>
                                                    </div>
                                                </template>

                                                <template lwc:if={expandedAcrLoading}></template>
                                                <template lwc:elseif={hasAcrConflicts}></template>
                                                <template lwc:else>
                                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                                        No duplicate contact relations across these accounts — safe to merge.
                                                    </p>
                                                </template>
                                            </div>

                                            <div class="slds-m-top_small slds-grid slds-grid_vertical-align-center slds-wrap">
                                                <lightning-button label={queueButtonLabel}
                                                    variant="brand" icon-name="utility:adduser"
                                                    disabled={queueButtonDisabled}
                                                    onclick={handleQueueMerge}
                                                    class="slds-m-right_x-small"></lightning-button>
                                                <lightning-button label={mergeButtonLabel}
                                                    variant="neutral" icon-name="utility:merge"
                                                    disabled={mergeButtonDisabled}
                                                    onclick={handleStartMerge}></lightning-button>
                                                <template lwc:if={queueingGroup}>
                                                    <lightning-spinner alternative-text="Queueing"
                                                        size="small"
                                                        class="slds-m-left_x-small"></lightning-spinner>
                                                </template>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small slds-size_1-of-1">
                                                    Queue runs the merge in the background using the master plus "fill nulls from duplicates" policy. Cherry-pick when you need per-field control.
                                                </p>
                                            </div>
                                            </template>
                                        </div>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <template lwc:if={loadingGroups}></template>
                    <template lwc:elseif={hasFilteredGroups}></template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-text-color_weak slds-p-vertical_small">
                            {emptyMessage}
                        </p>
                    </template>
                </div>
            </lightning-card>
        </div>
    </div>
</template>
