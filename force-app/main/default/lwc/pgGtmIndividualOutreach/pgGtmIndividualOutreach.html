<template>
    <div class="pg-outreach-toolbar slds-p-horizontal_x-small slds-p-bottom_x-small">
        <label class="pg-checkbox">
            <input type="checkbox" checked={groupByManager} onchange={handleToggleGroup} />
            <span>Group rows by manager</span>
        </label>
    </div>

    <div class="slds-grid slds-gutters slds-wrap">

        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_x-small">
            <article class="pg-card">
                <header class="pg-card__title pg-card__title--with-control">
                    <span>{leftCardTitle}</span>
                    <lightning-combobox
                        class="pg-window-select"
                        label="Window"
                        variant="label-hidden"
                        value={leftWindow}
                        options={leftWindowOptions}
                        onchange={handleLeftWindowChange}>
                    </lightning-combobox>
                </header>
                <template lwc:if={hasLeftRows}>
                    <table class="pg-table">
                        <thead>
                            <tr>
                                <th class="pg-th pg-th--sortable" data-field="ownerName" onclick={handleLeftSort}>Name</th>
                                <th class="pg-th pg-th--sortable" data-field="emails"   onclick={handleLeftSort}>OB Emails</th>
                                <th class="pg-th pg-th--sortable" data-field="calls"    onclick={handleLeftSort}>OB Calls</th>
                                <th class="pg-th pg-th--sortable" data-field="linkedin" onclick={handleLeftSort}>OB LinkedIn</th>
                                <th class="pg-th pg-th--sortable" data-field="meetings" onclick={handleLeftSort}>Meetings</th>
                                <th class="pg-th pg-th--sortable" data-field="total"    onclick={handleLeftSort}>Total OB</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template lwc:if={groupByManager}>
                                <template for:each={leftGroups} for:item="g">
                                    <tr key={g.key} class="pg-tr--group">
                                        <td class="pg-td pg-td--name pg-td--group">{g.managerName}</td>
                                        <td class="pg-td pg-td--group">{g.emailsSum}</td>
                                        <td class="pg-td pg-td--group">{g.callsSum}</td>
                                        <td class="pg-td pg-td--group">{g.linkedinSum}</td>
                                        <td class="pg-td pg-td--group">{g.meetingsSum}</td>
                                        <td class="pg-td pg-td--group">{g.totalSum}</td>
                                    </tr>
                                    <template for:each={g.rows} for:item="row">
                                        <tr key={row.ownerId}>
                                            <td class="pg-td pg-td--name pg-td--indent">{row.ownerName}</td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.emails}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--emails" style={row.emailsBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.calls}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--calls" style={row.callsBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.linkedin}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--linkedin" style={row.linkedinBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.meetings}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--meetings" style={row.meetingsBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.total}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--total" style={row.totalBar}></span></span></div></td>
                                        </tr>
                                    </template>
                                </template>
                            </template>
                            <template lwc:else>
                                <template for:each={leftRows} for:item="row">
                                    <tr key={row.ownerId}>
                                        <td class="pg-td pg-td--name">{row.ownerName}</td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.emails}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--emails" style={row.emailsBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.calls}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--calls" style={row.callsBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.linkedin}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--linkedin" style={row.linkedinBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.meetings}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--meetings" style={row.meetingsBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.total}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--total" style={row.totalBar}></span></span></div></td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                        <template lwc:if={leftTotals}>
                            <tfoot>
                                <tr class="pg-tr--totals">
                                    <td class="pg-td pg-td--name">Grand total</td>
                                    <td class="pg-td">{leftTotals.emails}</td>
                                    <td class="pg-td">{leftTotals.calls}</td>
                                    <td class="pg-td">{leftTotals.linkedin}</td>
                                    <td class="pg-td">{leftTotals.meetings}</td>
                                    <td class="pg-td">{leftTotals.total}</td>
                                </tr>
                            </tfoot>
                        </template>
                    </table>
                </template>
                <template lwc:else>
                    <div class="pg-empty">No outreach in this window.</div>
                </template>
            </article>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_x-small">
            <article class="pg-card">
                <header class="pg-card__title">Individual Outreach · Quarter to Date</header>
                <template lwc:if={hasQtdRows}>
                    <table class="pg-table">
                        <thead>
                            <tr>
                                <th class="pg-th pg-th--sortable" data-field="ownerName" onclick={handleQtdSort}>Name</th>
                                <th class="pg-th pg-th--sortable" data-field="emails"   onclick={handleQtdSort}>OB Emails</th>
                                <th class="pg-th pg-th--sortable" data-field="calls"    onclick={handleQtdSort}>OB Calls</th>
                                <th class="pg-th pg-th--sortable" data-field="linkedin" onclick={handleQtdSort}>OB LinkedIn</th>
                                <th class="pg-th pg-th--sortable" data-field="meetings" onclick={handleQtdSort}>Meetings</th>
                                <th class="pg-th pg-th--sortable" data-field="total"    onclick={handleQtdSort}>Total OB</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template lwc:if={groupByManager}>
                                <template for:each={qtdGroups} for:item="g">
                                    <tr key={g.key} class="pg-tr--group">
                                        <td class="pg-td pg-td--name pg-td--group">{g.managerName}</td>
                                        <td class="pg-td pg-td--group">{g.emailsSum}</td>
                                        <td class="pg-td pg-td--group">{g.callsSum}</td>
                                        <td class="pg-td pg-td--group">{g.linkedinSum}</td>
                                        <td class="pg-td pg-td--group">{g.meetingsSum}</td>
                                        <td class="pg-td pg-td--group">{g.totalSum}</td>
                                    </tr>
                                    <template for:each={g.rows} for:item="row">
                                        <tr key={row.ownerId}>
                                            <td class="pg-td pg-td--name pg-td--indent">{row.ownerName}</td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.emails}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--emails" style={row.emailsBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.calls}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--calls" style={row.callsBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.linkedin}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--linkedin" style={row.linkedinBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.meetings}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--meetings" style={row.meetingsBar}></span></span></div></td>
                                            <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.total}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--total" style={row.totalBar}></span></span></div></td>
                                        </tr>
                                    </template>
                                </template>
                            </template>
                            <template lwc:else>
                                <template for:each={qtdRows} for:item="row">
                                    <tr key={row.ownerId}>
                                        <td class="pg-td pg-td--name">{row.ownerName}</td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.emails}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--emails" style={row.emailsBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.calls}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--calls" style={row.callsBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.linkedin}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--linkedin" style={row.linkedinBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.meetings}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--meetings" style={row.meetingsBar}></span></span></div></td>
                                        <td class="pg-td"><div class="pg-bar-cell"><span class="pg-bar-num">{row.total}</span><span class="pg-bar-track"><span class="pg-bar pg-bar--total" style={row.totalBar}></span></span></div></td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                        <template lwc:if={qtdTotals}>
                            <tfoot>
                                <tr class="pg-tr--totals">
                                    <td class="pg-td pg-td--name">Grand total</td>
                                    <td class="pg-td">{qtdTotals.emails}</td>
                                    <td class="pg-td">{qtdTotals.calls}</td>
                                    <td class="pg-td">{qtdTotals.linkedin}</td>
                                    <td class="pg-td">{qtdTotals.meetings}</td>
                                    <td class="pg-td">{qtdTotals.total}</td>
                                </tr>
                            </tfoot>
                        </template>
                    </table>
                </template>
                <template lwc:else>
                    <div class="pg-empty">No outreach yet this quarter.</div>
                </template>
            </article>
        </div>

    </div>
</template>
