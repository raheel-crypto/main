<template>
    <div class="slds-grid slds-gutters slds-wrap">

        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_x-small">
            <article class="pg-card">
                <header class="pg-card__title">Individual Outreach (CW)</header>
                <template lwc:if={hasCwRows}>
                    <table class="pg-table">
                        <thead>
                            <tr>
                                <th class="pg-th pg-th--sortable" data-field="ownerName" onclick={handleCwSort}>Name</th>
                                <th class="pg-th pg-th--sortable" data-field="emails"   onclick={handleCwSort}>OB Emails</th>
                                <th class="pg-th pg-th--sortable" data-field="calls"    onclick={handleCwSort}>OB Calls</th>
                                <th class="pg-th pg-th--sortable" data-field="linkedin" onclick={handleCwSort}>OB LinkedIn</th>
                                <th class="pg-th pg-th--sortable" data-field="meetings" onclick={handleCwSort}>Meetings</th>
                                <th class="pg-th pg-th--sortable" data-field="total"    onclick={handleCwSort}>Total OB</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={cwRows} for:item="row">
                                <tr key={row.ownerId}>
                                    <td class="pg-td pg-td--name">{row.ownerName}</td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.emails}</span>
                                            <span class="pg-bar pg-bar--emails" style={row.emailsBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.calls}</span>
                                            <span class="pg-bar pg-bar--calls" style={row.callsBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.linkedin}</span>
                                            <span class="pg-bar pg-bar--linkedin" style={row.linkedinBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.meetings}</span>
                                            <span class="pg-bar pg-bar--meetings" style={row.meetingsBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.total}</span>
                                            <span class="pg-bar pg-bar--total" style={row.totalBar}></span>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                        <template lwc:if={cwTotals}>
                            <tfoot>
                                <tr class="pg-tr--totals">
                                    <td class="pg-td pg-td--name">Grand total</td>
                                    <td class="pg-td">{cwTotals.emails}</td>
                                    <td class="pg-td">{cwTotals.calls}</td>
                                    <td class="pg-td">{cwTotals.linkedin}</td>
                                    <td class="pg-td">{cwTotals.meetings}</td>
                                    <td class="pg-td">{cwTotals.total}</td>
                                </tr>
                            </tfoot>
                        </template>
                    </table>
                </template>
                <template lwc:else>
                    <div class="pg-empty">No outreach yet this week.</div>
                </template>
            </article>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_x-small">
            <article class="pg-card">
                <header class="pg-card__title">Individual Outreach (QTD)</header>
                <template lwc:if={hasQtdRows}>
                    <table class="pg-table">
                        <thead>
                            <tr>
                                <th class="pg-th pg-th--sortable" data-field="ownerName" onclick={handleQtdSort}>Name</th>
                                <th class="pg-th pg-th--sortable" data-field="emails"   onclick={handleQtdSort}>OB Emails</th>
                                <th class="pg-th pg-th--sortable" data-field="calls"    onclick={handleQtdSort}>OB Calls</th>
                                <th class="pg-th pg-th--sortable" data-field="linkedin" onclick={handleQtdSort}>OB LinkedIn</th>
                                <th class="pg-th pg-th--sortable" data-field="meetings" onclick={handleQtdSort}>Meetings</th>
                                <th class="pg-th pg-th--sortable" data-field="total"    onclick={handleQtdSort}>Total OB</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={qtdRows} for:item="row">
                                <tr key={row.ownerId}>
                                    <td class="pg-td pg-td--name">{row.ownerName}</td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.emails}</span>
                                            <span class="pg-bar pg-bar--emails" style={row.emailsBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.calls}</span>
                                            <span class="pg-bar pg-bar--calls" style={row.callsBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.linkedin}</span>
                                            <span class="pg-bar pg-bar--linkedin" style={row.linkedinBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.meetings}</span>
                                            <span class="pg-bar pg-bar--meetings" style={row.meetingsBar}></span>
                                        </div>
                                    </td>
                                    <td class="pg-td">
                                        <div class="pg-bar-cell">
                                            <span class="pg-bar-num">{row.total}</span>
                                            <span class="pg-bar pg-bar--total" style={row.totalBar}></span>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                        <template lwc:if={qtdTotals}>
                            <tfoot>
                                <tr class="pg-tr--totals">
                                    <td class="pg-td pg-td--name">Grand total</td>
                                    <td class="pg-td">{qtdTotals.emails}</td>
                                    <td class="pg-td">{qtdTotals.calls}</td>
                                    <td class="pg-td">{qtdTotals.linkedin}</td>
                                    <td class="pg-td">{qtdTotals.meetings}</td>
                                    <td class="pg-td">{qtdTotals.total}</td>
                                </tr>
                            </tfoot>
                        </template>
                    </table>
                </template>
                <template lwc:else>
                    <div class="pg-empty">No outreach yet this quarter.</div>
                </template>
            </article>
        </div>

    </div>
</template>
