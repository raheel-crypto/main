<template>
    <template lwc:if={hasStatus}>
        <article class="pg-status-card">
            <header class="pg-status-card__title">Stage 2+ Status | QTD</header>
            <div class="slds-grid slds-gutters slds-p-around_small pg-status-card__body">
                <div class="slds-col">
                    <div class="pg-status__label">{status.nbLabel}</div>
                    <div class="pg-status__value">{status.nbDisplay}</div>
                </div>
                <div class="slds-col">
                    <div class="pg-status__label">{status.expLabel}</div>
                    <div class="pg-status__value">{status.expDisplay}</div>
                </div>
                <div class="slds-col">
                    <div class="pg-status__label">Goal (QTD)</div>
                    <div class="pg-status__value">{status.goalDisplay}</div>
                </div>
                <div class="slds-col">
                    <div class="pg-status__label">Attainment</div>
                    <div class="pg-status__value">{status.attainmentDisplay}</div>
                </div>
            </div>
        </article>
    </template>

    <template lwc:if={hasPods}>
        <div class="slds-grid slds-gutters slds-wrap pg-pods">
            <template for:each={pods} for:item="pod">
                <div key={pod.pod} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-p-around_x-small">
                    <article class={pod.cardClass}>
                        <header class="pg-pod__header">
                            <div class="pg-pod__name">{pod.pod}</div>
                            <div class="pg-pod__totals">
                                <span class="pg-pod__count">{pod.totalDisplay}</span>
                                <span class="pg-pod__sep">/</span>
                                <span class="pg-pod__goal">{pod.goalDisplay}</span>
                                <span class="pg-pod__pct">{pod.attainmentDisplay}</span>
                            </div>
                            <div class="pg-pod__sublabel">Stage 2+ / Goal QTD · Attainment</div>
                        </header>
                        <ol class="pg-pod__list">
                            <template for:each={pod.rows} for:item="row">
                                <li key={row.ownerId} class="pg-pod__row">
                                    <span class="pg-pod__rank">{row.rank}</span>
                                    <span class="pg-pod__rep">{row.ownerName}</span>
                                    <span class="pg-pod__rep-count">{row.totalDisplay}</span>
                                    <span class="pg-pod__rep-pct">{row.attainmentDisplay}</span>
                                </li>
                            </template>
                            <template lwc:if={pod.empty}>
                                <li class="pg-pod__empty">No QTD performers yet.</li>
                            </template>
                        </ol>
                    </article>
                </div>
            </template>
        </div>
    </template>
    <template lwc:else>
        <div class="pg-empty">No QTD pod data yet.</div>
    </template>
</template>
