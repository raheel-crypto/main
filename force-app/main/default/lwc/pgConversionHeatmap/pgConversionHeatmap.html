<template>
    <article class="pg-card">
        <header class="pg-card__title pg-heatmap__title-bar">
            <span>Conversion Rates | All Time</span>
            <div class="pg-heatmap__controls">
                <div class="pg-mini-toggle">
                    <button type="button" class={countToggleClass}  onclick={handleSelectCount}># of opps</button>
                    <button type="button" class={amountToggleClass} onclick={handleSelectAmount}>$ pipeline</button>
                </div>
                <div class="pg-mini-toggle">
                    <button type="button" class={aeToggleClass}  onclick={handleSelectAE}>By AE</button>
                    <button type="button" class={podToggleClass} onclick={handleSelectPod}>By Pod</button>
                </div>
                <template lwc:if={isPodMode}>
                    <label class="pg-checkbox">
                        <input type="checkbox" checked={combineIB} onchange={handleToggleCombineIB} />
                        <span>Combine IB1 + IB2</span>
                    </label>
                </template>
                <template lwc:if={showGroupByManager}>
                    <label class="pg-checkbox">
                        <input type="checkbox" checked={groupByManager} onchange={handleToggleGroupByManager} />
                        <span>Group by Manager</span>
                    </label>
                </template>
            </div>
        </header>
        <template lwc:if={hasRows}>
            <div class="pg-heatmap__wrap">
                <table class="pg-heatmap">
                    <thead>
                        <tr>
                            <template lwc:if={isPodMode}>
                                <th class="pg-heatmap__th-name">Pod</th>
                            </template>
                            <template lwc:else>
                                <th class="pg-heatmap__th-name">Manager</th>
                                <th class="pg-heatmap__th-name">AE</th>
                            </template>
                            <th>Demo → Discovery</th>
                            <th>Discovery → POV</th>
                            <th>POV → Proposal</th>
                            <th>Proposal → Contracting</th>
                            <th>Contracting → Closed Won</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template lwc:if={isGrouped}>
                            <template for:each={rowGroups} for:item="g">
                                <template for:each={g.rows} for:item="row">
                                    <tr key={row.groupKey} class={row.rowClass}>
                                        <template lwc:if={row.isFirstInGroup}>
                                            <td class="pg-heatmap__td-name pg-heatmap__td-mgr" rowspan={g.rowCount}>{g.managerName}</td>
                                        </template>
                                        <td class="pg-heatmap__td-name pg-heatmap__td-ae">{row.ownerName}</td>
                                        <td class={row.demoToDiscoClass}           data-from-rank="1" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.demoToDiscoFmt}</td>
                                        <td class={row.discoToPovClass}            data-from-rank="2" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.discoToPovFmt}</td>
                                        <td class={row.povToProposalClass}         data-from-rank="3" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.povToProposalFmt}</td>
                                        <td class={row.proposalToContractingClass} data-from-rank="4" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.proposalToContractingFmt}</td>
                                        <td class={row.contractingToWonClass}      data-from-rank="5" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.contractingToWonFmt}</td>
                                    </tr>
                                </template>
                            </template>
                        </template>
                        <template lwc:else>
                            <template for:each={rows} for:item="row">
                                <tr key={row.groupKey}>
                                    <template lwc:if={isPodMode}>
                                        <td class="pg-heatmap__td-name">{row.ownerName}</td>
                                    </template>
                                    <template lwc:else>
                                        <td class="pg-heatmap__td-name">{row.managerName}</td>
                                        <td class="pg-heatmap__td-name">{row.ownerName}</td>
                                    </template>
                                    <td class={row.demoToDiscoClass}           data-from-rank="1" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.demoToDiscoFmt}</td>
                                    <td class={row.discoToPovClass}            data-from-rank="2" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.discoToPovFmt}</td>
                                    <td class={row.povToProposalClass}         data-from-rank="3" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.povToProposalFmt}</td>
                                    <td class={row.proposalToContractingClass} data-from-rank="4" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.proposalToContractingFmt}</td>
                                    <td class={row.contractingToWonClass}      data-from-rank="5" data-group-key={row.groupKey} data-owner-name={row.ownerName} onclick={handleCellClick}>{row.contractingToWonFmt}</td>
                                </tr>
                            </template>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template lwc:else>
            <div class="pg-empty">No conversion data available yet.</div>
        </template>
    </article>

    <template lwc:if={drillOpen}>
        <section class="pg-drill__backdrop" onclick={closeDrill}>
            <div class="pg-drill" onclick={preventBackdropClose}>
                <header class="pg-drill__header">
                    <span class="pg-drill__title">{drillTitle}</span>
                    <button type="button" class="pg-drill__close" onclick={closeDrill}>×</button>
                </header>
                <template lwc:if={drillLoading}>
                    <div class="slds-p-around_large slds-text-align_center">
                        <lightning-spinner alternative-text="Loading"></lightning-spinner>
                    </div>
                </template>
                <template lwc:else>
                    <template lwc:if={drillSummary}>
                        <div class="pg-drill__summary">
                            <span class="pg-drill__summary-headline">
                                <strong>{drillSummary.advanced}</strong>/<strong>{drillSummary.settled}</strong>
                                settled deals advanced ({drillSummary.pct})
                            </span>
                            <span class="pg-drill__pills">
                                <span class="pg-drill__pill pg-drill__pill--won">{drillSummary.won} Closed Won</span>
                                <span class="pg-drill__pill pg-drill__pill--open">{drillSummary.openLater} Open · later stage</span>
                                <span class="pg-drill__pill pg-drill__pill--lost-progressed">{drillSummary.lostProgressed} Lost · progressed</span>
                                <span class="pg-drill__pill pg-drill__pill--lost-source">{drillSummary.lostSource} Lost · didn’t advance</span>
                                <span class="pg-drill__pill pg-drill__pill--in-flight">{drillSummary.inFlight} In flight (not counted)</span>
                            </span>
                        </div>
                    </template>
                    <div class="pg-drill__table-wrap">
                        <table class="pg-drill__table">
                            <thead>
                                <tr>
                                    <th>Opportunity</th>
                                    <th>Stage</th>
                                    <th>Amount</th>
                                    <th>Close Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={drillRows} for:item="r">
                                    <tr key={r.oppId} class={r.rowClass}>
                                        <td>{r.name}</td>
                                        <td>{r.stageName}</td>
                                        <td>{r.amountFmt}</td>
                                        <td>{r.closeDateFmt}</td>
                                        <td>{r.statusLabel}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </section>
    </template>
</template>
