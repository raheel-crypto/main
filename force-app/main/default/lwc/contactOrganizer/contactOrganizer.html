<template>
    <lightning-card title="Contact Organizer" icon-name="standard:relationship">
        <div slot="actions">
            <lightning-button
                label="Reset"
                onclick={handleReset}
                disabled={isSaving}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Save"
                onclick={handleSave}
                disabled={saveDisabled}>
            </lightning-button>
        </div>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-vertical_large">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={showError}>
                <div class="slds-text-color_error slds-p-vertical_small">{errorMessage}</div>
            </template>

            <template lwc:if={showMainUI}>
                <div class="organizer-meta">
                    <div>
                        <span class="slds-text-title_caps">Account:</span>
                        <span class="slds-text-body_regular slds-m-left_xx-small">{accountName}</span>
                    </div>
                    <div class="organizer-meta__stats">
                        <span class="slds-text-body_small slds-text-color_weak">{totalContactsLabel}</span>
                        <span class="slds-text-body_small slds-text-color_weak organizer-meta__dot">•</span>
                        <span class="slds-text-body_small slds-text-color_weak">{assignedCountLabel}</span>
                    </div>
                </div>

                <div class="summary-strip">
                    <template for:each={summaryStats} for:item="stat">
                        <div key={stat.key} class="summary-stat">
                            <div class="summary-stat__label">{stat.label}</div>
                            <div class="summary-stat__value">{stat.value}</div>
                        </div>
                    </template>
                </div>

                <div class="organizer-layout">
                    <div
                        class="search-panel"
                        ondragover={handleDragOver}
                        ondragleave={handleDragLeave}
                        ondrop={handleDropOnSearch}>
                        <div class="search-panel__header">
                            <lightning-input
                                type="search"
                                label="Search contacts"
                                variant="label-hidden"
                                placeholder={searchPlaceholder}
                                value={searchTerm}
                                onchange={handleSearchChange}>
                            </lightning-input>
                        </div>
                        <div class="search-panel__body">
                            <template lwc:if={showSearchSpinner}>
                                <div class="search-panel__status">
                                    <lightning-spinner alternative-text="Searching" size="x-small" variant="inverse"></lightning-spinner>
                                </div>
                            </template>

                            <template lwc:if={showSearchResults}>
                                <template for:each={searchResultsToRender} for:item="c">
                                    <div
                                        key={c.id}
                                        class={c.cssClass}
                                        draggable="true"
                                        data-contact-id={c.id}
                                        ondragstart={handleDragStart}>
                                        <div class="contact-tile__main">
                                            <div class="contact-tile__name">{c.name}</div>
                                            <template lwc:if={c.title}>
                                                <div class="contact-tile__meta">{c.title}</div>
                                            </template>
                                            <template lwc:if={c.hasActivity}>
                                                <span class={c.activityBadge.cssClass} title={c.activityBadge.tooltip}>
                                                    <lightning-icon icon-name="utility:activity" size="xx-small"></lightning-icon>
                                                    <span class="activity-pill__count">{c.activityBadge.countLabel}</span>
                                                    <template lwc:if={c.activityBadge.relativeLabel}>
                                                        <span class="activity-pill__sep">·</span>
                                                        <span class="activity-pill__rel">{c.activityBadge.relativeLabel}</span>
                                                    </template>
                                                </span>
                                            </template>
                                        </div>
                                        <div class="contact-tile__actions">
                                            <lightning-button-icon
                                                icon-name="utility:info"
                                                variant="bare"
                                                size="small"
                                                alternative-text="View details"
                                                title="View details"
                                                data-contact-id={c.id}
                                                onclick={handleOpenDetail}>
                                            </lightning-button-icon>
                                            <lightning-button-menu
                                                alternative-text="Add to bucket"
                                                icon-name="utility:add"
                                                icon-size="x-small"
                                                menu-alignment="right"
                                                data-contact-id={c.id}
                                                onselect={handleMoveMenu}>
                                                <lightning-menu-item value="C-Suite/Executive" label="Add to C-Suite / Executive"></lightning-menu-item>
                                                <lightning-menu-item value="Technology/Ops" label="Add to Technology / Ops"></lightning-menu-item>
                                                <lightning-menu-item value="Senior User" label="Add to Senior User"></lightning-menu-item>
                                                <lightning-menu-item value="Junior User" label="Add to Junior User"></lightning-menu-item>
                                            </lightning-button-menu>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <template lwc:if={showSearchEmpty}>
                                <div class="search-panel__empty">{searchEmptyMessage}</div>
                            </template>
                        </div>
                        <div class="search-panel__footer slds-text-body_small slds-text-color_weak">
                            Drag onto a bucket, or use the menu. Drag back here to unassign.
                        </div>
                    </div>

                    <div class="bucket-grid">
                        <template for:each={bucketColumns} for:item="col">
                            <div
                                key={col.key}
                                class="bucket"
                                data-role={col.key}
                                ondragover={handleDragOver}
                                ondragleave={handleDragLeave}
                                ondrop={handleDropOnBucket}>
                                <div class="bucket__header">
                                    <span class="bucket__title">{col.label}</span>
                                    <span class="bucket__count">{col.count}</span>
                                </div>
                                <div class="bucket__body">
                                    <template lwc:if={col.isEmpty}>
                                        <div class="bucket__empty">Drag a contact here</div>
                                    </template>
                                    <template for:each={col.tiles} for:item="t">
                                        <div
                                            key={t.contactId}
                                            class={t.cssClass}
                                            draggable="true"
                                            data-contact-id={t.contactId}
                                            ondragstart={handleDragStart}>
                                            <div class="contact-tile__main">
                                                <div class="contact-tile__name-row">
                                                    <span class="contact-tile__name">{t.name}</span>
                                                    <template lwc:if={t.isChampion}>
                                                        <span class="champion-pill" title="Champion">
                                                            <lightning-icon
                                                                icon-name="utility:favorite"
                                                                size="xx-small"
                                                                variant="inverse">
                                                            </lightning-icon>
                                                            <span class="champion-pill__label">Champion</span>
                                                        </span>
                                                    </template>
                                                </div>
                                                <template lwc:if={t.title}>
                                                    <div class="contact-tile__meta">{t.title}</div>
                                                </template>
                                                <template lwc:if={t.hasActivity}>
                                                    <span class={t.activityBadge.cssClass} title={t.activityBadge.tooltip}>
                                                        <lightning-icon icon-name="utility:activity" size="xx-small"></lightning-icon>
                                                        <span class="activity-pill__count">{t.activityBadge.countLabel}</span>
                                                        <template lwc:if={t.activityBadge.relativeLabel}>
                                                            <span class="activity-pill__sep">·</span>
                                                            <span class="activity-pill__rel">{t.activityBadge.relativeLabel}</span>
                                                        </template>
                                                    </span>
                                                </template>
                                            </div>
                                            <div class="contact-tile__actions">
                                                <lightning-button-icon
                                                    icon-name="utility:info"
                                                    variant="bare"
                                                    size="small"
                                                    alternative-text="View details"
                                                    title="View details"
                                                    data-contact-id={t.contactId}
                                                    onclick={handleOpenDetail}>
                                                </lightning-button-icon>
                                                <lightning-button-icon
                                                    icon-name={t.championIcon}
                                                    variant={t.championVariant}
                                                    size="small"
                                                    alternative-text={t.championAlt}
                                                    title={t.championAlt}
                                                    data-contact-id={t.contactId}
                                                    onclick={handleToggleChampion}>
                                                </lightning-button-icon>
                                                <lightning-button-menu
                                                    alternative-text="Actions"
                                                    icon-size="small"
                                                    menu-alignment="right"
                                                    data-contact-id={t.contactId}
                                                    onselect={handleMoveMenu}>
                                                    <lightning-menu-item value="C-Suite/Executive" label="Move to C-Suite / Executive"></lightning-menu-item>
                                                    <lightning-menu-item value="Technology/Ops" label="Move to Technology / Ops"></lightning-menu-item>
                                                    <lightning-menu-item value="Senior User" label="Move to Senior User"></lightning-menu-item>
                                                    <lightning-menu-item value="Junior User" label="Move to Junior User"></lightning-menu-item>
                                                    <lightning-menu-divider></lightning-menu-divider>
                                                    <lightning-menu-item value="UNASSIGN" label="Remove from buckets"></lightning-menu-item>
                                                </lightning-button-menu>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template lwc:if={showNoAccountMessage}>
                <div class="slds-text-body_regular slds-p-vertical_small">
                    This Opportunity is not linked to an Account. Set an Account on the Opportunity to organize contacts.
                </div>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={isDetailOpen}>
        <section
            class="detail-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="detail-modal-title"
            onclick={handleDetailBackdrop}>
            <div class="detail-modal__panel">
                <header class="detail-modal__header">
                    <div class="detail-modal__title-wrap">
                        <h2 id="detail-modal-title" class="detail-modal__title">{detailHeaderLabel}</h2>
                        <template lwc:if={contactDetail.title}>
                            <div class="detail-modal__subtitle">{contactDetail.title}</div>
                        </template>
                        <template lwc:if={contactDetail.email}>
                            <div class="detail-modal__email">{contactDetail.email}</div>
                        </template>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare"
                        size="medium"
                        alternative-text="Close"
                        title="Close"
                        onclick={handleCloseDetail}>
                    </lightning-button-icon>
                </header>

                <div class="detail-modal__body">
                    <template lwc:if={isLoadingDetail}>
                        <div class="detail-modal__loading">
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <template lwc:if={detailError}>
                        <div class="slds-text-color_error slds-p-vertical_small">{detailError}</div>
                    </template>

                    <template lwc:if={detailHasContent}>
                        <div class="detail-section">
                            <div class="summary-strip detail-summary">
                                <template for:each={detailStats} for:item="stat">
                                    <div key={stat.key} class="summary-stat">
                                        <div class="summary-stat__label">{stat.label}</div>
                                        <div class="summary-stat__value">{stat.value}</div>
                                    </div>
                                </template>
                            </div>

                            <div class="detail-breakdown">
                                <template for:each={detailBreakdown} for:item="b">
                                    <div key={b.key} class="detail-breakdown__item">
                                        <lightning-icon icon-name={b.icon} size="xx-small"></lightning-icon>
                                        <span class="detail-breakdown__value">{b.value}</span>
                                        <span class="detail-breakdown__label">{b.label}</span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="detail-columns">
                            <div class="detail-col">
                                <template lwc:if={hasTimeline}>
                                    <div class="detail-section">
                                        <h3 class="detail-section__title">Recent activity</h3>
                                        <ul class="timeline">
                                            <template for:each={detailTimeline} for:item="item">
                                                <li key={item.key} class="timeline__item">
                                                    <div class="timeline__top">
                                                        <span class="timeline__type">{item.type}</span>
                                                        <span class="timeline__date">{item.relative}</span>
                                                    </div>
                                                    <div class="timeline__subject">{item.subject}</div>
                                                </li>
                                            </template>
                                        </ul>
                                    </div>
                                </template>
                            </div>

                            <div class="detail-col">
                                <template lwc:if={hasAnyGong}>
                                    <div class="detail-section">
                                        <h3 class="detail-section__title">Gong insights</h3>

                                        <template lwc:if={hasGongTopics}>
                                            <div class="detail-subsection">
                                                <div class="detail-subsection__label">Topics discussed</div>
                                                <div class="chip-row">
                                                    <template for:each={detailGongTopics} for:item="t">
                                                        <span key={t.key} class="chip chip--topic">{t.label}</span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>

                                        <template lwc:if={hasGongTrackers}>
                                            <div class="detail-subsection">
                                                <div class="detail-subsection__label">Trackers</div>
                                                <div class="chip-row">
                                                    <template for:each={detailGongTrackers} for:item="t">
                                                        <span key={t.key} class="chip chip--tracker" title={t.phrase}>
                                                            {t.name}
                                                            <span class="chip__count">{t.occurrences}</span>
                                                        </span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>

                                        <template lwc:if={hasGongLatestCall}>
                                            <div class="detail-subsection">
                                                <div class="detail-subsection__label">
                                                    Latest call · {detailGongLatestDateLabel}
                                                </div>
                                                <template lwc:if={detailGongLatestBrief}>
                                                    <p class="detail-paragraph">{detailGongLatestBrief}</p>
                                                </template>
                                                <template lwc:if={hasGongKeyPoints}>
                                                    <div class="detail-subsection__sublabel">Key points</div>
                                                    <ul class="detail-list">
                                                        <template for:each={detailGongKeyPoints} for:item="kp">
                                                            <li key={kp.key}>{kp.text}</li>
                                                        </template>
                                                    </ul>
                                                </template>
                                                <template lwc:if={detailGongLatestNextSteps}>
                                                    <div class="detail-subsection__sublabel">Next steps</div>
                                                    <p class="detail-paragraph">{detailGongLatestNextSteps}</p>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template lwc:if={hasAnyGranola}>
                                    <div class="detail-section">
                                        <h3 class="detail-section__title">Meeting notes</h3>
                                        <template lwc:if={hasGranolaTopics}>
                                            <div class="detail-subsection">
                                                <div class="detail-subsection__label">Topics</div>
                                                <div class="chip-row">
                                                    <template for:each={detailGranolaTopics} for:item="t">
                                                        <span key={t.key} class="chip chip--note">{t.label}</span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                        <template lwc:if={hasGranolaSummary}>
                                            <div class="detail-subsection">
                                                <div class="detail-subsection__label">
                                                    Latest summary · {detailGranolaDateLabel}
                                                </div>
                                                <p class="detail-paragraph">{detailGranolaSummary}</p>
                                            </div>
                                        </template>
                                        <template lwc:if={hasGranolaActionItems}>
                                            <div class="detail-subsection">
                                                <div class="detail-subsection__label">Action items</div>
                                                <ul class="detail-list">
                                                    <template for:each={detailGranolaActionItems} for:item="a">
                                                        <li key={a.key}>{a.text}</li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </template>
</template>
