<template>
    <div class="pg-app">
        <div class="pg-app__header slds-p-around_small">
            <h1 class="pg-app__title">PG Insights</h1>
            <p class="pg-app__subtitle">AE Pipeline Generation Pacing &amp; Outreach</p>
        </div>

        <lightning-tabset variant="scoped" active-tab-value={activeTab}>
            <lightning-tab label="Quarter Recap" value="recap">
                <div class="pg-toggle-row slds-p-horizontal_small slds-p-top_small">
                    <span class="pg-toggle__label">Show as:</span>
                    <div class="pg-toggle">
                        <button type="button" class={countToggleClass}  onclick={handleSelectCount}># of opps</button>
                        <button type="button" class={amountToggleClass} onclick={handleSelectAmount}>$ pipeline</button>
                    </div>
                    <span class="pg-toggle__label pg-toggle__label--right">Source:</span>
                    <div class="pg-toggle">
                        <button type="button" class={allSourceToggleClass}  onclick={handleSelectAllSource}>All opps</button>
                        <button type="button" class={aeSourcedToggleClass}  onclick={handleSelectAeSourced}>AE-sourced only</button>
                    </div>
                    <span class="pg-toggle__label pg-toggle__label--right">Date logic:</span>
                    <div class="pg-toggle">
                        <button type="button" class={oppHistoryToggleClass}  onclick={handleSelectOppHistory}>Stage 2+ entry</button>
                        <button type="button" class={createdDateToggleClass} onclick={handleSelectCreatedDate}>Opp created</button>
                    </div>
                </div>
                <template lwc:if={showPacingKpis}>
                    <div class="slds-p-around_small">
                        <c-pg-pacing-kpis metric={metric} source-mode={sourceMode} date-mode={dateMode}></c-pg-pacing-kpis>
                    </div>
                </template>
                <div class="slds-p-horizontal_small">
                    <c-pg-stage-progress-chart metric={metric} source-mode={sourceMode} date-mode={dateMode}></c-pg-stage-progress-chart>
                </div>
                <div class="slds-p-around_small">
                    <c-pg-top-performers metric={metric} source-mode={sourceMode} date-mode={dateMode}></c-pg-top-performers>
                </div>
            </lightning-tab>

            <lightning-tab label="Individual Outreach" value="outreach">
                <div class="slds-p-around_small">
                    <c-pg-individual-outreach></c-pg-individual-outreach>
                </div>
            </lightning-tab>

            <lightning-tab label="Conversion" value="conversion">
                <div class="slds-p-around_small">
                    <c-pg-conversion-heatmap></c-pg-conversion-heatmap>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </div>
</template>
