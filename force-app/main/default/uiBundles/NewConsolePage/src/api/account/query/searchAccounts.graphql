query SearchAccounts(
	$first: Int
	$after: String
	$where: Account_Filter
	$orderBy: Account_OrderBy
) {
	uiapi {
		query {
			Account(first: $first, after: $after, where: $where, orderBy: $orderBy) {
				edges {
					node {
						Id
						Name @optional { value displayValue }
						AccountNumber @optional { value displayValue }
						Industry @optional { value displayValue }
						Type @optional { value displayValue }
						Phone @optional { value displayValue }
						Owner @optional {
							Name @optional { value displayValue }
						}
						AnnualRevenue @optional { value displayValue }
						Account_Status__c @optional { value displayValue }
						Account_Tier__c @optional { value displayValue }
						Account_Health_Score__c @optional { value displayValue }
						Segment__c @optional { value displayValue }
						Region__c @optional { value displayValue }
						ARR__c @optional { value displayValue }
						Business_Type__c @optional { value displayValue }
					}
				}
				pageInfo {
					hasNextPage
					hasPreviousPage
					endCursor
					startCursor
				}
				totalCount
			}
		}
	}
}
